tivity Tier</text><rect x="170" y="718" width="460" height="58" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="751.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Select Up to Two Activities per Dimension</text><rect x="170" y="800" width="460" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="827.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Arrange Activities in Sequence</text><rect x="170" y="870" width="460" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="897.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Archive Previous Active Programme</text><rect x="170" y="940" width="460" height="58" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="973.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Create Programme with 28-Day Reassessment</text><rect x="170" y="1022" width="460" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="1049.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Store Programme and Activity Records</text><rect x="170" y="1092" width="460" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="400" y="1119.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Display Personalised Programme</text><rect x="234.4" y="1162" width="331.2" height="40" rx="20" fill="#eef3f9" stroke="#374151" stroke-width="1.8"/><text x="400" y="1187" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">END</text><rect x="1037.2" y="60" width="345.59999999999997" height="40" rx="20" fill="#eef3f9" stroke="#374151" stroke-width="1.8"/><text x="1210" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">Activity Opened</text><rect x="970" y="126" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="153.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Start Activity</text><rect x="970" y="198" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="225.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Read Objectives and Instructions</text><rect x="970" y="270" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="297.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Complete the Required Task</text><rect x="970" y="342" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="369.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Submit Written Reflection</text><polygon points="1210,414 1416.4,454 1210,494 1003.6,454" fill="#edf5f4" stroke="#0e5f5b" stroke-width="1.8" stroke-linejoin="round"/><text x="1210" y="458.1" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111827">Knowledge Check Available?</text><rect x="970" y="520" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="547.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Answer All Check Questions</text><rect x="970" y="592" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="619.3" font-size="12" font-weight="400" text-anchor="middle" fill="#111827">Calculate Check Score</text><polygon points="1210,664 1416.4,704 1210,744 1003.6,704" fill="#edf5f4" stroke="#0e5f5b" stroke-width="1.8" stroke-linejoin="round"/><text x="1210" y="708.1" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111827">Score Below 60%?</text><rect x="970" y="770" width="480" height="46" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.7"/><text x="1210" y="797.3" font-size="12" font-weight="400" text-anchor="middle" fill="#1